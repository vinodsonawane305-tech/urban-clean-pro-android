name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          mkdir -p app-source
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Android project ZIP not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d app-source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find app-source -type f -name "gradlew" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "gradlew not found"
            find app-source -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT_DIR"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Urban-Clean-Pro-APK
          path: "**/build/outputs/apk/debug/*.apk"
